<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>투표 처형 · 캐릭터 20종</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#10191e;color:#eee8db;font-family:system-ui,"Malgun Gothic",sans-serif}
header{max-width:1580px;margin:auto;padding:40px 28px 24px} .eyebrow{color:#d0b071;font-size:12px;letter-spacing:3px}h1{font-size:30px;margin:10px 0}p{color:#aebac0;margin:10px 0;line-height:1.7}
nav{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}nav button,a{color:inherit}button{font:inherit;cursor:pointer}
nav button{border:1px solid #41505a;background:#1e2b33;color:#c6d1d5;border-radius:5px;padding:8px 14px}nav button[aria-pressed=true]{border-color:#c7a567;color:#ebce92}
main{max-width:1580px;margin:auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;padding:0 28px 40px}
.card{overflow:hidden;text-align:left;color:inherit;border:1px solid #31414a;border-radius:10px;background:#18262f;padding:0;transition:transform .18s,border-color .18s}
.card:hover{transform:translateY(-3px);border-color:#c7a567}.art,.zoom-art{background-color:#26353e;background-image:conic-gradient(#2d3e48 25%,transparent 0 50%,#2d3e48 0 75%,transparent 0);background-size:24px 24px}
.art{aspect-ratio:2/3;padding:12px}.art img{width:100%;height:100%;object-fit:contain;display:block}
body[data-bg=light] .art,body[data-bg=light] .zoom-art{background:#e6e1d4}body[data-bg=dark] .art,body[data-bg=dark] .zoom-art{background:#0d171c}
.label{padding:14px}.label span{font:11px monospace;color:#b89a62;margin-right:8px}.label strong{font-size:15px}.label small{display:block;font-size:10px;color:#8ea0a9;margin-top:7px;letter-spacing:.7px}
footer{max-width:1580px;padding:0 28px 30px;margin:auto;font-size:12px;color:#8ea0a9}
dialog{padding:0;border:1px solid #50606a;border-radius:10px;background:#18262f;color:inherit;width:min(620px,92vw);max-height:96vh}
dialog::backdrop{background:#000b}.zoom-art{height:77vh;padding:16px}.zoom-art img{width:100%;height:100%;object-fit:contain}.modal-head{display:flex;justify-content:space-between;padding:12px 18px;align-items:center}.modal-head button{border:0;background:transparent;color:#fff;font-size:24px}a{color:#d9b979}
@media(max-width:1050px){main{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:760px){main{grid-template-columns:repeat(2,minmax(0,1fr));padding:0 14px 30px}header{padding:28px 16px}h1{font-size:24px}.label strong{font-size:13px}.label small{font-size:8px}}
</style></head>

<dialog id="zoom"><div class="modal-head"><strong id="zoom-title"></strong><button id="close" aria-label="닫기">×</button></div><div class="zoom-art"><img id="zoom-image" alt=""></div></dialog>
<script>
document.querySelectorAll('nav button').forEach(b=>b.addEventListener('click',()=>{document.body.dataset.bg=b.dataset.bg;document.querySelectorAll('nav button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))}));
const zoom=document.querySelector('#zoom'), image=document.querySelector('#zoom-image');
document.querySelectorAll('.card').forEach(card=>card.addEventListener('click',()=>{const src=card.querySelector('img');image.src=src.src;image.alt=src.alt;document.querySelector('#zoom-title').textContent=card.querySelector('strong').textContent;zoom.showModal()}));
document.querySelector('#close').addEventListener('click',()=>zoom.close());zoom.addEventListener('click',e=>{if(e.target===zoom){const r=zoom.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)zoom.close()}});
</script></body></html>
