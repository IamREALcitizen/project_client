<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>Day Transition Storyboard</title>
<style>
@font-face { font-family: Kyobo; src: url(../../Assets/Fonts/KyoboHandwriting2025lyb.ttf); }
@font-face { font-family: Nanum; src: url(../../Assets/Fonts/NanumGothic-Regular.ttf); }

:root {
  --paper: #f3eee3;
  --ink: #2a2018;
  --muted: #7a6a58;
  --gold: #d8a84a;
  --red: #c8352c;
  --teal: #1f5a5e;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); font-family: "Malgun Gothic", Nanum, sans-serif; color: var(--ink); }
.board { display: none; padding: 34px 40px 30px; }
.board.on { display: block; }

/* ---------------------------------------------------------------- 보드 머리 */
.head { display: flex; align-items: flex-end; gap: 22px; margin-bottom: 10px; }
.head .tag { font: 700 15px "Malgun Gothic"; color: #fff; background: var(--ink); padding: 6px 12px; border-radius: 6px; letter-spacing: .5px; }
.head h1 { margin: 0; font: 700 34px "Malgun Gothic"; letter-spacing: -.5px; }
.head h1 em { font-style: normal; color: var(--red); }
.head .cond { margin-left: auto; text-align: right; font-size: 15px; color: var(--muted); line-height: 1.5; }
.head .cond code { font: 600 14px Consolas, monospace; color: var(--ink); background: #e6dece; padding: 1px 6px; border-radius: 4px; }

.tlwrap { position: relative; margin: 14px 0 34px; }
.timeline { display: flex; height: 30px; border-radius: 6px; overflow: hidden; background: #e4dccb; }
.tlwrap .mk { position: absolute; top: -4px; height: 38px; border-left: 2px dashed var(--ink); }
.tlwrap .mk span { position: absolute; top: 38px; left: -1px; transform: translateX(-50%); font: 700 12px "Malgun Gothic"; color: var(--ink); white-space: nowrap; }
.tlwrap .mk.end { border-left-style: solid; border-left-width: 3px; }
.tlwrap .mk.end span { left: auto; right: -2px; transform: none; }
.timeline .seg { position: relative; display: flex; align-items: center; justify-content: center; font: 700 13px "Malgun Gothic"; color: #fff; border-right: 2px solid var(--paper); white-space: nowrap; }
.timeline .seg:last-child { border-right: 0; }

/* ---------------------------------------------------------------- 컷 */
.strip { display: flex; gap: 28px; }
.cut { width: 360px; flex: none; }
.cut .label { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; font: 700 19px "Malgun Gothic"; }
.cut .label b { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--ink); color: #fff; font-size: 14px; transform: translateY(-2px); }
.cut .label span { margin-left: auto; font: 600 14px Consolas, monospace; color: var(--muted); }
.cut .label i { font-style: normal; font: 700 11px "Malgun Gothic"; color: #fff; background: #8a7a66; padding: 2px 6px; border-radius: 4px; transform: translateY(-3px); }
.cut .cap { margin-top: 10px; font-size: 14.5px; line-height: 1.55; color: #3b3027; min-height: 92px; }
.cut .cap strong { color: var(--ink); }
.cut .cap .sfx { display: inline-block; font: 700 12px "Malgun Gothic"; color: #fff; background: #4a6b8a; padding: 1px 7px; border-radius: 4px; margin-right: 4px; }
.cut .cap .hap { background: #8a5a9a; }

.frame { position: relative; width: 360px; height: 640px; overflow: hidden; border-radius: 14px; background: #000; box-shadow: 0 10px 24px #0004, 0 0 0 1px #0006; isolation: isolate; }
.frame > * { position: absolute; }
.fill { inset: 0; }
.bg { inset: 0; background-size: cover; background-position: center; }

/* 시네마 바 */
.bar { left: 0; right: 0; height: 64px; background: #050403; z-index: 40; }
.bar.t { top: 0; border-bottom: 1px solid #b8893a66; }
.bar.b { bottom: 0; border-top: 1px solid #b8893a66; }

/* 연출 글자 */
.cine { left: 0; right: 0; text-align: center; z-index: 30; font-family: Batang, serif; color: #f4e6c4; text-shadow: 0 2px 6px #000, 0 0 18px #000a; }
.cine .big { font-size: 34px; font-weight: 700; letter-spacing: 2px; }
.cine .mid { font-size: 21px; letter-spacing: 1px; }
.cine .sm { font-size: 15px; letter-spacing: 1px; opacity: .9; }
.cine .rule { display: block; margin: 8px auto; width: 150px; height: 9px; background:
  radial-gradient(circle, #e8c070 0 2px, transparent 3px) center/9px 9px no-repeat,
  linear-gradient(90deg, transparent, #e8c070aa 30%, transparent 48%, transparent 52%, #e8c070aa 70%, transparent) center/100% 1px no-repeat; }

/* 효과음 글자 (스토리보드 표기) */
.onoma { z-index: 35; font-family: Kyobo; font-size: 46px; color: #fff; -webkit-text-stroke: 3px #9c1d17; paint-order: stroke fill; transform: rotate(-10deg); text-shadow: 0 4px 0 #3a0806; }
.onoma.gold { -webkit-text-stroke-color: #8a5a10; text-shadow: 0 4px 0 #3a2506; }
.onoma.blue { -webkit-text-stroke-color: #1d4f7c; text-shadow: 0 4px 0 #0b2238; }
.onoma.dark { -webkit-text-stroke-color: #2a1d10; text-shadow: 0 4px 0 #000; }

/* 스토리보드 메모 (프레임 위 연필 표기) */
.note { z-index: 60; font: 700 11.5px "Malgun Gothic"; color: #1a1a1a; background: #ffe36be6; padding: 3px 7px; border-radius: 4px; box-shadow: 0 1px 3px #0006; white-space: nowrap; }
.arrow { z-index: 59; overflow: visible; }

/* 게임 HUD (축약) */
.hud > *, .stage > * { position: absolute; }
.hud { left: 0; right: 0; top: 0; height: 58px; z-index: 20; background: linear-gradient(#0b1220ee, #0b122000); }
.plaque { position: absolute; display: grid; place-items: center; background: url(../../Assets/Resources/GameHud/PhasePlaque.png) center/100% 100% no-repeat; font: 700 13px "Malgun Gothic"; color: #3a2612; }
.plaque .in { display: flex; align-items: center; gap: 5px; }
.timer { display: flex; align-items: center; justify-content: flex-end; padding-right: 22px; background: url(../../Assets/Resources/GameHud/TimerPanel.png) center/100% 100% no-repeat; font: 700 15px Consolas, monospace; color: #f2e2b8; }
.btn { background: center/contain no-repeat; }
.sun { width: 12px; height: 12px; border-radius: 50%; background: radial-gradient(#ffe9a0, #f0a020); box-shadow: 0 0 0 2px #f0a02055, 0 0 6px #ffb03a; }
.moon { width: 12px; height: 12px; border-radius: 50%; box-shadow: inset -4px 1px 0 0 #e9d48a; transform: rotate(-20deg); }

/* 공지 두루마리 */
.notice { z-index: 25; display: grid; place-items: center; padding: 0 4px; text-align: center; border-style: solid; border-width: 0 46px; border-image: url(../../Assets/Resources/GameHud/NoticeScroll.png) 0 135 fill / 0 46px stretch; font: 700 12.5px "Malgun Gothic"; color: #3a2612; line-height: 1.35; }
.notice .chip { position: absolute; top: -9px; left: 50%; transform: translateX(-50%); font: 700 10px "Malgun Gothic"; color: #f5e3b5; background: #1f3a40; border: 1px solid #c9a050; padding: 1px 8px; border-radius: 4px; }

/* 원탁 무대 */
.stage { left: 0; right: 0; top: 0; height: 392px; overflow: hidden; }
.deck { inset: 0; background-size: 360px auto; background-position: 0 -40px; }
.table { left: 50%; width: 262px; height: 175px; transform: translateX(-50%); background: url(../../Assets/Resources/DayTable/RoundTable.png) center/contain no-repeat; }
.actor { transform: translate(-50%, -100%); }
.spr { background-repeat: no-repeat; }
.chair { transform: translate(-50%, -100%); background: center bottom/contain no-repeat; }
.nm { transform: translateX(-50%); font: 700 9.5px "Malgun Gothic"; color: #f6ead0; background: #000a; padding: 1px 6px; border-radius: 8px; white-space: nowrap; z-index: 15; }
.nm.dead { color: #a8a8a8; text-decoration: line-through; }

/* 채팅 · 명단 (축약) */
.chat { left: 8px; right: 8px; top: 400px; height: 150px; border: 2px solid #9c7434; border-radius: 8px; background: #120d09f0; padding: 8px 8px 0; z-index: 10; box-shadow: inset 0 0 0 1px #000; }
.chat .row { display: flex; align-items: center; gap: 6px; height: 21px; font: 600 9.5px "Malgun Gothic"; color: #7fd77f; white-space: nowrap; overflow: hidden; }
.chat .row .who { flex: none; font-size: 8.5px; color: #f2deb0; background: #2c2216; border: 1px solid #6b5126; border-radius: 3px; padding: 0 5px; }
.chat .row.hl { color: #ff9a8a; }
.chat .row.gd { color: #ffd77a; }
.chat .input { position: absolute; left: 8px; right: 8px; bottom: 7px; height: 24px; border-radius: 12px; background: #e8d6ad; border: 1px solid #7a5a2a; font: 9px "Malgun Gothic"; color: #8a7558; padding: 5px 12px; }
.roster { left: 0; right: 0; top: 556px; height: 84px; z-index: 10; display: flex; justify-content: space-around; padding: 8px 6px 0; background: linear-gradient(#0f0b08, #1a130c); }
.roster .p { position: relative; width: 38px; text-align: center; font: 700 9px "Malgun Gothic"; color: #e9dcc0; }
.roster .face { width: 38px; height: 38px; border-radius: 50%; border: 2px solid #c99a46; background: #2a3a40 center 18%/150% no-repeat; box-shadow: 0 0 0 1px #000; margin-bottom: 4px; }
.roster .p.dead .face { filter: grayscale(1) brightness(.55); border-color: #666; }
.roster .p.dead::after { content: ""; position: absolute; left: 4px; top: 4px; width: 30px; height: 30px; background:
  linear-gradient(45deg, transparent 44%, #e0362c 44% 56%, transparent 56%),
  linear-gradient(-45deg, transparent 44%, #e0362c 44% 56%, transparent 56%); }
.roster .p.dead { color: #888; }
.roster .p.glint .face { box-shadow: 0 0 0 1px #000, 0 0 10px 3px #ffd76a; border-color: #ffe9a0; }
.roster .p.target .face { box-shadow: 0 0 0 1px #000, 0 0 12px 4px #ff3a2a; border-color: #ff6a50; }

/* 양피지 카드 */
.parch { border-style: solid; border-width: 30px 40px; border-image: url(../../Assets/Resources/GameHud/ParchmentPanel.png) 70 100 fill / 30px 40px stretch; }
.portrait { background: center top/cover no-repeat; }

/* 투표 카드 더미 */
.cards { transform: translate(-50%, -50%); z-index: 12; }
.cards .c { position: absolute; width: 26px; height: 41px; background: url(../../Assets/Resources/GameHud/CardBack.png) center/100% 100% no-repeat; box-shadow: 0 1px 2px #000a; border-radius: 2px; }
.cards .n { position: absolute; left: 22px; top: -10px; width: 20px; height: 20px; border-radius: 50%; background: #c8352c; border: 2px solid #ffd8a0; display: grid; place-items: center; font: 800 11px "Malgun Gothic"; color: #fff; z-index: 2; }

/* ---------------------------------------------------------------- 보드 꼬리 */
.foot { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; margin-top: 16px; }
.foot .box { background: #fbf8f1; border: 1px solid #ddd3c0; border-radius: 10px; padding: 12px 16px; font-size: 14px; line-height: 1.6; color: #3b3027; }
.foot .box h3 { margin: 0 0 6px; font: 700 14.5px "Malgun Gothic"; color: var(--ink); }
.foot .box ul { margin: 0; padding-left: 18px; }
.foot.two { grid-template-columns: 1.15fr 1fr 1fr; }
</style>
</head>
<body>

<div id="boards"></div>

<script>
// ============================================================== 에셋
const A = '../../Assets/';
const IMG = {
  deckDay: A + 'Resources/DayTable/Deck.png',
  deckNight: A + '09_Image/SceneBackgrounds/Night/PIRATE_SHARED_Night.png',
  chair: A + 'Resources/DayTable/ChairFront.png',
  settings: A + 'Resources/GameHud/ButtonSettings.png',
  map: A + 'Resources/GameHud/ButtonMap.png',
};
const sheet = key => `${A}09_Image/Characters/${key}_SD/${key}_BaseSheet.png`;
const portrait = id => `${A}09_Image/Portrait/${id}.png`;

// 스프라이트 시트의 칸 (Unity rect: x, 아래에서 y, w, h — 시트 1536x1024)
const RECT = {
  CrewSailor:       { front: [584, 512, 370, 476], back: [1076, 18, 413, 486], stand: [119, 512, 307, 506] },
  CrewCaptain:      { front: [588, 512, 406, 492], back: [1108, 18, 386, 478], stand: [113, 512, 376, 506] },
  ThirdMermaid:     { front: [528, 512, 484, 435], back: [1028, 10, 493, 486], stand: [17, 512, 460, 509] },
  CrewGunner:       { front: [569, 512, 399, 466], back: [1100, 27, 376, 475], stand: [82, 512, 341, 501] },
  CrewDrunk:        { front: [553, 512, 411, 480], back: [1104, 22, 393, 488], stand: [61, 512, 383, 512] },
  PirateCookFemale: { front: [594, 512, 383, 501], back: [1082, 18, 409, 494], stand: [73, 512, 354, 511] },
  CrewLookout:      { front: [552, 514, 465, 448], back: [1079, 16, 423, 473], stand: [38, 512, 473, 495] },
  ConceptSiren:     { front: [537, 512, 468, 499], back: [1038, 11, 457, 496], stand: [64, 512, 435, 512] },
};

// 플레이어 (스킨은 외형일 뿐 직업과 무관)
const CAST = {
  '나':  { key: 'CrewSailor',       p: 'CREW_SAILOR' },
  '철수': { key: 'CrewCaptain',      p: 'CREW_CAPTAIN' },
  '영희': { key: 'ThirdMermaid',     p: 'THIRD_MERMAID' },
  '민수': { key: 'CrewGunner',       p: 'CREW_GUNNER' },
  '지훈': { key: 'CrewDrunk',        p: 'CREW_DRUNK' },
  '수진': { key: 'PirateCookFemale', p: 'PIRATE_COOK_FEMALE' },
  '현우': { key: 'CrewLookout',      p: 'CREW_LOOKOUT' },
  '유나': { key: 'ConceptSiren',     p: 'CONCEPT_SIREN' },
};
const ORDER = ['나', '철수', '영희', '민수', '지훈', '수진', '현우', '유나'];

// 원탁 자리 (무대 좌표, 발끝 기준). z: 테이블(10) 뒤/앞
const SEATS = {
  '철수': { x: 92,  y: 214, pose: 'front', h: 78, z: 5 },
  '영희': { x: 148, y: 196, pose: 'front', h: 74, z: 4 },
  '민수': { x: 212, y: 196, pose: 'front', h: 76, z: 4 },
  '지훈': { x: 268, y: 214, pose: 'front', h: 78, z: 5 },
  '수진': { x: 46,  y: 300, pose: 'front', h: 86, z: 12 },
  '현우': { x: 314, y: 300, pose: 'front', h: 86, z: 12 },
  '유나': { x: 126, y: 374, pose: 'back',  h: 92, z: 14 },
  '나':  { x: 234, y: 374, pose: 'back',  h: 92, z: 14 },
};

// 고정 난수 (매번 같은 그림)
let seed = 7;
const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);

function sprite(name, pose, h, extraStyle = '') {
  const key = CAST[name] ? CAST[name].key : name;
  const [x, yU, w, hh] = RECT[key][pose];
  const k = h / hh, top = 1024 - yU - hh;
  return `<div class="spr" style="width:${(w * k).toFixed(1)}px;height:${h}px;background-image:url(${sheet(key)});` +
    `background-size:${(1536 * k).toFixed(1)}px ${(1024 * k).toFixed(1)}px;background-position:${(-x * k).toFixed(1)}px ${(-top * k).toFixed(1)}px;${extraStyle}"></div>`;
}

// ============================================================== 조각
const bars = () => `<div class="bar t"></div><div class="bar b"></div>`;
const note = (x, y, text) => `<div class="note" style="left:${x}px;top:${y}px">${text}</div>`;
const onoma = (x, y, text, cls = '', size = 46, rot = -10) =>
  `<div class="onoma ${cls}" style="left:${x}px;top:${y}px;font-size:${size}px;transform:rotate(${rot}deg)">${text}</div>`;

// 움직임 화살표 (스토리보드 표기)
function arrow(x1, y1, x2, y2, opt = {}) {
  const c = opt.color || '#fff', bend = opt.bend || 0, dash = opt.dash ? 'stroke-dasharray="7 5"' : '';
  const mx = (x1 + x2) / 2 - (y2 - y1) * bend, my = (y1 + y2) / 2 + (x2 - x1) * bend;
  const ang = Math.atan2(y2 - my, x2 - mx), L = 11;
  const h1 = [x2 - L * Math.cos(ang - 0.45), y2 - L * Math.sin(ang - 0.45)], h2 = [x2 - L * Math.cos(ang + 0.45), y2 - L * Math.sin(ang + 0.45)];
  return `<svg class="arrow" style="left:0;top:0" width="360" height="640" viewBox="0 0 360 640">
    <path d="M${x1} ${y1} Q${mx} ${my} ${x2} ${y2}" fill="none" stroke="#000a" stroke-width="5" ${dash}/>
    <path d="M${x1} ${y1} Q${mx} ${my} ${x2} ${y2}" fill="none" stroke="${c}" stroke-width="2.5" ${dash}/>
    <path d="M${h1} L${x2} ${y2} L${h2}" fill="none" stroke="#000a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M${h1} L${x2} ${y2} L${h2}" fill="none" stroke="${c}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

function plaque(text, icon, w = 118, h = 46, x = 8, y = 6, fs = 13) {
  const ic = icon === 'moon' ? '<span class="moon"></span>' : icon === 'sun' ? '<span class="sun"></span>' : '';
  return `<div class="plaque" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;font-size:${fs}px"><div class="in">${ic}${text}</div></div>`;
}

function hud(phase, icon, timer) {
  return `<div class="hud">${plaque(phase, icon)}
    <div class="timer" style="left:130px;top:7px;width:118px;height:44px">${timer}</div>
    <div class="btn" style="left:262px;top:9px;width:40px;height:40px;background-image:url(${IMG.settings})"></div>
    <div class="btn" style="left:308px;top:9px;width:40px;height:40px;background-image:url(${IMG.map})"></div></div>`;
}

function notice(text, top = 64, h = 52) {
  return `<div class="notice" style="left:24px;right:24px;top:${top}px;height:${h}px"><span class="chip">공지</span><div>${text}</div></div>`;
}

function chat(lines) {
  return `<div class="chat">${lines.map(l => `<div class="row ${l[1] || ''}"><span class="who">🔔 시스템</span>${l[0]}</div>`).join('')}
    <div class="input">메시지를 입력하세요...</div></div>`;
}

function roster(opt = {}) {
  return `<div class="roster">${ORDER.map(n => {
    const cls = (opt.dead || []).includes(n) ? 'dead' : (opt.glint ? 'glint' : '') + ((opt.target === n) ? ' target' : '');
    return `<div class="p ${cls}"><div class="face" style="background-image:url(${portrait(CAST[n].p)})"></div>${n}</div>`;
  }).join('')}</div>`;
}

// 원탁 무대. opt.empty: 빈자리(죽은 사람), opt.extra: 무대 위에 더 얹을 것
function stage(opt = {}) {
  const deck = opt.night ? IMG.deckNight : IMG.deckDay;
  let html = `<div class="stage"><div class="deck" style="position:absolute;background-image:url(${deck});${opt.deckStyle || ''}"></div>`;
  html += `<div class="table" style="position:absolute;top:150px;z-index:10"></div>`;
  for (const n of Object.keys(SEATS)) {
    const s = SEATS[n];
    if ((opt.empty || []).includes(n)) {
      html += `<div class="chair" style="position:absolute;left:${s.x}px;top:${s.y + 6}px;width:66px;height:78px;background-image:url(${IMG.chair});z-index:${s.z + 2};filter:brightness(.75) saturate(.7)"></div>`;
      if (opt.memorial === n) {
        // 빈 의자 등받이의 검은 리본 + 그 앞 테이블 위 촛불
        const cx = s.x, cy = s.y + 26;
        html += `<div style="position:absolute;left:${s.x - 24}px;top:${s.y - 52}px;width:48px;height:9px;background:#0d0d0d;transform:rotate(-16deg);box-shadow:0 1px 3px #000;z-index:${s.z + 3}"></div>
          <div style="position:absolute;left:${s.x + 6}px;top:${s.y - 50}px;width:7px;height:20px;background:#0d0d0d;transform:rotate(14deg);z-index:${s.z + 3}"></div>
          <div style="position:absolute;left:${cx - 40}px;top:${cy - 34}px;width:80px;height:50px;border-radius:50%;background:radial-gradient(#ffcf6a66,transparent 70%);z-index:11"></div>
          <div style="position:absolute;left:${cx - 4}px;top:${cy - 16}px;width:8px;height:17px;border-radius:2px;background:linear-gradient(90deg,#d8c8a0,#fff6e0 40%,#c8b48a);z-index:12;box-shadow:0 2px 2px #0008"></div>
          <div style="position:absolute;left:${cx - 5}px;top:${cy - 30}px;width:10px;height:15px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:radial-gradient(circle at 50% 70%,#fffbe0,#ffb030 55%,#ff6a0000 75%);box-shadow:0 0 16px 8px #ffb03066;z-index:12"></div>`;
      }
      html += `<div class="nm dead" style="position:absolute;left:${s.x}px;top:${s.y + 1}px">${n}</div>`;
      continue;
    }
    const style = !opt.dim ? '' : opt.dim !== n ? 'filter:brightness(.45) saturate(.6)' : 'filter:drop-shadow(0 0 2px #ff8a6a) drop-shadow(0 0 8px #ff2a1a)';
    html += `<div class="actor" style="position:absolute;left:${s.x}px;top:${s.y}px;z-index:${s.z}">${sprite(n, s.pose, s.h, style)}</div>`;
    html += `<div class="nm" style="position:absolute;left:${s.x}px;top:${s.y + 1}px">${n}</div>`;
  }
  html += (opt.extra || '') + `</div>`;
  return html;
}

// 게임 화면 전체 (HUD + 무대 + 채팅 + 명단)
function gameScreen(opt) {
  return stage(opt) + hud(opt.phase, opt.icon || 'sun', opt.timer || '02:00') +
    (opt.notice ? notice(opt.notice, 62, opt.noticeH || 52) : '') + chat(opt.chat || []) + roster(opt);
}

// 반짝이·불티·재 같은 작은 점들
function specks(n, opt) {
  let s = '';
  for (let i = 0; i < n; i++) {
    const x = (opt.x0 || 0) + rnd() * (opt.w || 360), y = (opt.y0 || 0) + rnd() * (opt.h || 640);
    const r = (opt.r0 || 1) + rnd() * (opt.r1 || 2);
    const a = (opt.a0 || .4) + rnd() * (1 - (opt.a0 || .4));
    s += `<div style="left:${x.toFixed(0)}px;top:${y.toFixed(0)}px;width:${(r * 2).toFixed(1)}px;height:${(r * 2).toFixed(1)}px;border-radius:50%;opacity:${a.toFixed(2)};background:${opt.color};box-shadow:0 0 ${(r * 3).toFixed(0)}px ${opt.glow || opt.color};z-index:${opt.z || 26}"></div>`;
  }
  return s;
}

// 붉은 칼자국 (cx, cy 중심, len 길이, ang 각도)
function slash(cx, cy, len, ang, w = 7, opt = {}) {
  const core = opt.core || '#fff6f0', glow = opt.glow || '#ff2a1a';
  return `<div style="left:${cx - len / 2}px;top:${cy - w / 2}px;width:${len}px;height:${w}px;transform:rotate(${ang}deg);z-index:${opt.z || 28};
    border-radius:50%;background:linear-gradient(90deg,transparent,${glow} 12%,${core} 50%,${glow} 88%,transparent);
    box-shadow:0 0 10px 3px ${glow}cc,0 0 30px 10px ${glow}55;opacity:${opt.o || 1}"></div>`;
}

// 별 모양 불꽃
function spark(x, y, r, color = '#fff2b0', rot = 0) {
  const pts = [];
  for (let i = 0; i < 16; i++) { const rr = i % 2 ? r * .22 : (i % 4 ? r * .6 : r); const a = i * Math.PI / 8; pts.push(`${(r + rr * Math.cos(a)).toFixed(1)},${(r + rr * Math.sin(a)).toFixed(1)}`); }
  return `<svg style="left:${x - r}px;top:${y - r}px;z-index:31;transform:rotate(${rot}deg);filter:drop-shadow(0 0 6px ${color}) drop-shadow(0 0 14px #ffae00)" width="${r * 2}" height="${r * 2}"><polygon points="${pts.join(' ')}" fill="${color}"/></svg>`;
}

// ============================================================== 그리기
function renderBoard(id, b) {
  const total = b.timeline.reduce((s, t) => s + t[1], 0);
  const tl = `<div class="timeline">${b.timeline.map(t => `<div class="seg" style="flex:${t[1]};background:${t[2]}">${t[0]} · ${t[1].toFixed(1)}s</div>`).join('')}</div>` +
    (b.phaseAt || []).map(p => `<div class="mk ${p[0] >= total ? 'end' : ''}" style="left:${(p[0] / total * 100).toFixed(2)}%"><span>${p[0].toFixed(1)}s ${p[1]}</span></div>`).join('');
  const cuts = b.cuts.map((c, i) => `<section class="cut">
      <div class="label"><b>${i + 1}</b>${c[0]}${c[2] ? `<i>${c[2]}</i>` : ''}<span>${c[1]}</span></div>
      <div class="frame">${c[3]}</div>
      <div class="cap">${c[4]}</div></section>`).join('');
  const foot = b.foot.map(f => `<div class="box"><h3>${f[0]}</h3><ul>${f[1].map(x => `<li>${x}</li>`).join('')}</ul></div>`).join('');
  return `<div class="board" id="${id}">
    <div class="head"><div class="tag">${b.tag}</div><h1>${b.title}</h1><div class="cond">${b.cond}</div></div>
    <div class="tlwrap">${tl}</div>
    <div class="strip">${cuts}</div>
    <div class="foot ${id === 'exec' ? 'two' : ''}">${foot}</div></div>`;
}

const root = document.getElementById('boards');
root.innerHTML = Object.entries(BOARDS).map(([id, b]) => renderBoard(id, b)).join('');
// #kill → 보드 하나, #kill/5 → 그 보드의 5번 컷만 두 배로 (확인용)
const [want, only] = (location.hash || '#kill').slice(1).split('/');
document.getElementById(want).classList.add('on');
if (only) {
  const cut = document.querySelectorAll(`#${want} .frame`)[only - 1];
  document.body.innerHTML = '';
  document.body.appendChild(cut);
  cut.style.zoom = location.search.includes("z1") ? 1 : 2;
  document.body.style.display = "flex";
  cut.style.borderRadius = 0;
}
